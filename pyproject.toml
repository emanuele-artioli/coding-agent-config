[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-config"
version = "0.1.0"
description = "Portable agent guidance, protection and native job orchestration"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentctl = "agentctl.cli:main"

[tool.setuptools.packages.find]
include = ["agentctl*"]

[tool.setuptools.package-data]
agentctl = ["content/*.md", "content/skills/*/SKILL.md"]
